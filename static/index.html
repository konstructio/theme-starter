<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Theme Starter · Konstruct</title>
<link rel="icon" href="theme-icon.png" />
<style>
  :root{
    --bg:#111518; --panel:#161b1f; --panel2:#192124; --line:#26313a; --line2:#38454f;
    --ink:#f3f5f7; --ink2:#c7ced3; --mut:#9fafbc; --mut2:#5b6c7c;
    --green:#00ff6f; --green2:#00c957; --blue:#00bcff; --amber:#fdc700; --red:#fb2c37;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'Reddit Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
  a{color:var(--green);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 24px 56px}
  .mono{font-family:var(--mono)}

  header{display:flex;align-items:center;gap:14px;padding:14px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.02em;font-size:16px}
  .brand svg{width:24px;height:24px}
  .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);border:1px solid var(--line2);border-radius:3px;padding:3px 8px}
  .spacer{flex:1}
  .docsbtn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#0c1416;background:var(--green);border-radius:4px;padding:6px 12px;font-weight:700}
  .docsbtn:hover{text-decoration:none;background:var(--green2)}

  .section-h{display:flex;align-items:center;gap:12px;margin:34px 0 14px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:700}
  .section-h span{flex:1;height:1px;background:var(--line)}

  /* hero */
  .hero{padding:34px 0 6px}
  .hero h1{font-size:30px;font-weight:800;letter-spacing:-.01em;margin:0 0 12px;color:var(--ink)}
  .hero h1 b{color:var(--green)}
  .hero p{font-size:15px;color:var(--ink2);max-width:760px;margin:0 0 6px}
  .hero .meta{font-family:var(--mono);font-size:12px;color:var(--mut);margin-top:14px}

  /* flow diagram */
  .flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin-top:4px}
  .node{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .node .n{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:6px}
  .node .b{font-weight:700;color:var(--ink);font-size:14px}
  .node .d{font-size:12px;color:var(--mut);margin-top:5px}
  .node.self{border-color:rgba(0,255,111,.35)} .node.self .b{color:var(--green)}
  .arrow{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 12px;min-width:120px;color:var(--mut);font-family:var(--mono);font-size:10px;text-align:center;letter-spacing:.04em}
  .arrow .a{color:var(--green);font-size:18px;line-height:1}
  .arrow .l{margin-top:4px}
  @media(max-width:760px){.arrow{min-width:0;flex-direction:row;gap:8px;padding:8px 0;transform:rotate(90deg)}}
  .note{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--green);border-radius:6px;padding:12px 15px;margin-top:14px;font-size:13px;color:var(--ink2)}
  .note b{color:var(--ink)}

  /* capability grid */
  .caps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:820px){.caps{grid-template-columns:1fr}}
  .capcol{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
  .capcol .ch{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .capcol .ch .t{font-size:13px;font-weight:700;color:var(--ink)}
  .badge{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;border-radius:3px;padding:2px 7px;font-weight:700}
  .badge.read{color:var(--blue);border:1px solid rgba(0,188,255,.4)}
  .badge.write{color:var(--amber);border:1px solid rgba(253,199,63,.4)}
  .badge.you{color:var(--green);border:1px solid rgba(0,255,111,.4)}
  .op{padding:7px 0;border-top:1px solid rgba(56,69,79,.5);font-size:13px}
  .op:first-of-type{border-top:none}
  .op code{font-family:var(--mono);color:var(--green);font-size:12px}
  .op .od{color:var(--mut);display:block;font-size:12px;margin-top:1px}

  /* profiles */
  .profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:820px){.profiles{grid-template-columns:1fr}}
  .prof{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
  .prof .pn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);font-weight:700}
  .prof .pt{font-weight:700;font-size:15px;margin:6px 0 6px;color:var(--ink)}
  .prof .pd{font-size:13px;color:var(--mut)}
  .prof .eg{font-family:var(--mono);font-size:11px;color:var(--mut2);margin-top:10px}

  /* preview + generic panels */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:14px}
  .panel h2{font-size:13px;font-weight:700;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:10px}
  .demo-badge{font-family:var(--mono);font-size:10px;color:var(--amber);border:1px solid rgba(253,199,63,.4);border-radius:3px;padding:2px 7px;letter-spacing:.1em}
  .sub{font-size:12px;color:var(--mut);margin-bottom:10px}
  .item{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid rgba(56,69,79,.5);font-size:13px;flex-wrap:wrap}
  .item:first-child{border-top:none}
  .item b{color:var(--ink)}
  .grp{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;padding-top:12px}
  .bar{flex:1 1 120px;height:7px;background:var(--panel2);border-radius:999px;overflow:hidden;min-width:80px;border:1px solid var(--line)}
  .bar i{display:block;height:100%;background:var(--green);border-radius:999px}
  .chip{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line2);color:var(--mut);border-radius:999px;padding:2px 9px}
  .st{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:inline-flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .st.Live{color:var(--green)} .st.Live .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
  .st.Building{color:var(--blue)} .st.Building .dot{background:var(--blue)}
  .st.Failed{color:var(--red)} .st.Failed .dot{background:var(--red)}
  .url{font-family:var(--mono);font-size:11px}
  .err{color:var(--red);font-family:var(--mono);font-size:12px}

  /* live dashboard */
  .quota-row{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid rgba(56,69,79,.5);font-size:12px}
  .quota-row:first-of-type{border-top:none}
  .quota-row .ql{flex:0 0 68px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
  .quota-row .qv{flex:0 0 150px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink2)}
  .appsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .appcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:13px 15px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .12s}
  .appcard:hover{border-color:var(--line2)}
  .appcard.sel{border-color:rgba(0,255,111,.5)}
  .appcard .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .appcard .an{font-weight:700;font-size:13.5px;color:var(--ink)}
  .appcard .meta{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--mut2)}
  .bdg{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;border-radius:3px;padding:2px 6px;font-weight:700}
  .bdg.vol{color:var(--amber);border:1px solid rgba(253,199,63,.45)}
  .bdg.dom-ok{color:var(--green);border:1px solid rgba(0,255,111,.45)}
  .bdg.dom-wait{color:var(--amber);border:1px solid rgba(253,199,63,.45)}
  .ava{position:relative;width:26px;height:26px;flex:0 0 26px;border-radius:6px;overflow:hidden;background:var(--panel);border:1px solid var(--line2)}
  .ava .avaM{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--mut)}
  .ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
  .sparkrow{display:flex;gap:14px;align-items:center}
  .sparkrow .sl{font-family:var(--mono);font-size:9px;color:var(--mut2);letter-spacing:.08em}
  .sparkrow svg{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:4px}
  .charts3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .chart .chh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
  .chart .chh .cl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
  .chart .chh .cv{font-family:var(--mono);font-size:11.5px}
  .chart svg{width:100%;height:88px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:5px}
  .chart .chf{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--mut2);margin-top:3px}
  .logpane{height:300px;overflow:auto;display:flex;flex-direction:column-reverse;background:#0b0f12;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
  .logpane pre{margin:0;font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--mut);white-space:pre-wrap}
  .loghead{display:flex;align-items:center;gap:10px;margin:14px 0 7px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  .loghead .lv{color:var(--green)} .loghead .lv.off{color:var(--amber)}
  .reconnect{font-family:var(--mono);font-size:10px;color:var(--blue);border:1px solid rgba(0,188,255,.4);background:none;border-radius:4px;padding:4px 9px;cursor:pointer}
  .buildpre{max-height:220px;overflow:auto;background:#0b0f12;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--mut);white-space:pre-wrap;margin:0}
  .closebtn{font-family:var(--mono);font-size:10px;color:var(--mut);border:1px solid var(--line2);background:none;border-radius:4px;padding:4px 9px;cursor:pointer;margin-left:auto}
  .closebtn:hover{color:var(--ink)}

  /* steps */
  .steps{counter-reset:s}
  .step{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
  .step:first-child{border-top:none}
  .step .num{counter-increment:s;flex:0 0 28px;height:28px;border-radius:50%;border:1px solid var(--green);color:var(--green);font-family:var(--mono);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
  .step .num::before{content:counter(s)}
  .step .sc{font-size:13px;color:var(--ink2)}
  .step .sc b{color:var(--ink)}
  .step code{font-family:var(--mono);color:var(--green);font-size:12px}

  .doclinks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(max-width:640px){.doclinks{grid-template-columns:1fr}}
  .doclink{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px 14px}
  .doclink:hover{border-color:var(--line2);text-decoration:none}
  .doclink .dt{font-weight:700;color:var(--ink);font-size:13px}
  .doclink .dd{font-size:12px;color:var(--mut)}

  /* fleet strip */
  .fleet{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 15px}
  .stat .kv{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
  .stat .kv b{color:var(--green);font-weight:700}
  .stat .kl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-top:3px}
  .stat .ks{font-family:var(--mono);font-size:10px;color:var(--mut2);margin-top:2px}
  /* zone group headers */
  .zonehead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
  .zonehead:first-child{border-top:none;margin-top:4px;padding-top:0}
  .zonehead .zn{font-weight:700;font-size:14px;color:var(--ink)}
  .zonehead .zsub{font-family:var(--mono);font-size:10.5px;color:var(--mut2)}
  .zonehead .spacer{flex:1}
  .zchip{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;border-radius:3px;padding:2px 7px;font-weight:700}
  .zchip.off{color:var(--red);border:1px solid rgba(251,44,55,.45)}
  /* deployment timeline */
  .tl{margin-top:4px}
  .tlrow{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid rgba(56,69,79,.5);font-size:12.5px;flex-wrap:wrap}
  .tlrow:first-child{border-top:none}
  .tlrow .tn{font-family:var(--mono);font-size:11px;color:var(--ink2);font-weight:700;flex:0 0 74px}
  .tlrow .trv{font-family:var(--mono);font-size:11px;color:var(--mut2)}
  .tlrow .trr{color:var(--ink2)}
  .tlrow .trd{font-family:var(--mono);font-size:10.5px;color:var(--mut2);margin-left:auto;font-variant-numeric:tabular-nums}
  /* size + rate chips */
  .refline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--mut2);padding-top:10px}
  .refline .rk{border:1px solid var(--line2);border-radius:4px;padding:2px 8px;color:var(--mut)}
  .refline .rk b{color:var(--ink2);font-weight:700}
  .statrow{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--mut);margin:2px 0 12px}
  .statrow b{color:var(--ink2);font-weight:700}
  .failmsg{font-family:var(--mono);font-size:11px;color:var(--red);white-space:pre-wrap}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;color:var(--mut2);font-size:12px;flex-wrap:wrap}
  .live-banner{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid rgba(0,255,111,.3);border-radius:8px;padding:11px 15px;margin:18px 0 6px;font-size:13px;color:var(--ink2)}
  .live-banner .dot{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,255,111,.5)}70%{box-shadow:0 0 0 6px rgba(0,255,111,0)}100%{box-shadow:0 0 0 0 rgba(0,255,111,0)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6" fill="var(--green)" stroke="none"/></svg>
      Theme Starter
    </div>
    <span class="tag">reference theme</span>
    <div class="spacer"></div>
    <a class="docsbtn" href="https://konstruct.civo.com/docs/next/konduit" target="_blank" rel="noopener">Read the docs →</a>
  </header>
  <div id="root">loading…</div>
</div>

<script src="theme.js"></script>
<script>
  const root = document.getElementById("root");
  const DOCS = "https://konstruct.civo.com/docs/next/konduit";
  const org = new URLSearchParams(location.search).get("org");

  // API data is org-controlled, not theme-controlled — escape it before innerHTML.
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  const num = (v) => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
  // "8500m" is millicores; "24" is cores. Quota and zone figures mix both.
  const cores = (v) => { const t = String(v ?? "0").trim(); const n = parseFloat(t); return isFinite(n) ? (/m$/.test(t) ? n / 1000 : n) : 0; };



  // ---- capability + profile content (kept in sync with theme.js) ----
  const CAPS = [
    { title:"Observe", badge:"read", cls:"read", ops:[
      ["discover","what your org is, its entitled app sizes, and which capabilities it exposes"],
      ["zones","your logical environments — every app ships into one"],
      ["apps","everything you've shipped, with live phase, URL, volume and domain state"],
      ["metrics","cpu, memory, network and limit-ceiling time-series per app"],
      ["quota","the org-wide allowance meter — cpu, memory, storage used vs limit"],
      ["buildLogs","the latest build's log output"],
      ["deployments","the app's real build history — number, reason, revision, duration"],
      ["regions","the managed workload clusters apps can target"],
    ]},
    { title:"Live streams", badge:"push", cls:"read", ops:[
      ["logs","live runtime log lines pushed from the app's pods (subscribe/unsubscribe)"],
      ["appEvents","one push per app create/update/delete — refetch instead of polling"],
    ]},
    { title:"Build", badge:"write", cls:"write", ops:[
      ["createZone","create a new logical environment in a metaphor of your choosing"],
      ["deleteZone","remove an empty environment — refused (409) while apps still live there"],
      ["shipApp","deploy an app from a connected repo and branch into an environment"],
      ["updateApp","change branch, size, replicas, volume or custom domain of a running app"],
      ["redeploy","re-roll the latest build"],
      ["deleteApp","tear an app down"],
      ["appRepos","list the repos an org can deploy from"],
    ]},
    { title:"Personalize", badge:"you", cls:"you", ops:[
      ["character","load the player/persona your theme has saved"],
      ["saveCharacter","persist cosmetics, level, or preferences"],
    ]},
  ];
  const PROFILES = [
    { name:"Informational", t:"A live report", d:"Read-only. Turns your org's data into dashboards and reports. Never mutates anything — safe on production.", eg:"e.g. this starter, launched" },
    { name:"Interactive", t:"A working console", d:"Reads and writes. Ship, scale, re-roll and tear down apps, claim zones, watch build logs — all through the contract.", eg:"e.g. Konduit" },
    { name:"Game", t:"An arcade", d:"Interactive plus progression: a character, XP, quests and cosmetics that turn shipping software into play.", eg:"e.g. Ship It!" },
  ];

  function capCol(c){
    return `<div class="capcol"><div class="ch"><span class="t">${c.title}</span><span class="badge ${c.cls}">${c.badge}</span></div>
      ${c.ops.map(([n,d]) => `<div class="op"><code>theme.${esc(n)}()</code><span class="od">${esc(d)}</span></div>`).join("")}</div>`;
  }
  function profCard(p){
    return `<div class="prof"><div class="pn">${esc(p.name)}</div><div class="pt">${esc(p.t)}</div><div class="pd">${esc(p.d)}</div><div class="eg">${esc(p.eg)}</div></div>`;
  }

  function docLinks(){
    const L = [
      ["The theme", "The postMessage contract, transport and security model", "/theme"],
      ["Themes", "What a theme is and how it's delivered", "/themes"],
      ["Creating a theme", "Build one by hand, step by step", "/creating-a-theme"],
      ["Theme specification", "The conformance checklist every theme meets", "/theme-spec"],
      ["The game formula", "Turn a PaaS into progression and play", "/game-formula"],
      ["This theme", "The Theme Starter reference", "/themes/starter"],
    ];
    return `<div class="doclinks">${L.map(([t,d,p]) =>
      `<a class="doclink" href="${DOCS}${p}" target="_blank" rel="noopener"><span class="dt">${t} →</span><span class="dd">${d}</span></a>`).join("")}</div>`;
  }

  function renderWelcome(){
    root.innerHTML = `
      <div class="hero">
        <h1>This is a <b>theme theme</b>.</h1>
        <p>A theme is a frontend that lives in its own Git repository and is built, deployed and served by Konstruct's own delivery pipeline. Launched from the platform, it renders your organization's <b>zones</b> (the capacity you own) and <b>apps</b> (the things you ship) — as any metaphor its author chooses: planets, city blocks, race teams, or a plain business console like this one.</p>
        <p class="hero-meta mono" style="color:var(--mut);margin-top:14px">You're viewing the starter directly, so it's showing this guide. Launch it from Konstruct and it comes alive with your real data.</p>
      </div>

      <div class="section-h">How it works<span></span></div>
      <div class="flow">
        <div class="node self"><div class="n">Your theme</div><div class="b">Sandboxed iframe</div><div class="d">Runs on Konstruct infrastructure with no credentials, no token, nothing in storage.</div></div>
        <div class="arrow"><div class="a">→</div><div class="l">postMessage<br/>(no secrets)</div></div>
        <div class="node"><div class="n">Konstruct</div><div class="b">The broker</div><div class="d">Validates the sender, allows only theme ops, and pins every call to the org you were launched for.</div></div>
        <div class="arrow"><div class="a">→</div><div class="l">your session<br/>on its origin</div></div>
        <div class="node"><div class="n">Platform</div><div class="b">The API</div><div class="d">Performs the real call as the signed-in user and replies to your theme's origin only.</div></div>
      </div>
      <div class="note">Your theme never touches a credential. It asks for data; the platform does the work and hands back the result. That's the whole contract — and it's why a theme can be a public, forkable web page and still be safe. <a href="${DOCS}/theme" target="_blank" rel="noopener">Read the contract →</a></div>

      <div class="section-h">What you can build with the contract<span></span></div>
      <div class="caps">${CAPS.map(capCol).join("")}</div>

      <div class="section-h">Three kinds of theme<span></span></div>
      <div class="profiles">${PROFILES.map(profCard).join("")}</div>

      <div class="section-h">See it with data<span></span></div>
      <div class="panel">
        <h2>Your organization</h2>
        <div class="sub">Nothing to preview here on purpose — this theme never shows fictional data. Launch it from Konstruct and this section renders your real zones, apps, quota, metrics, and live logs. No data beats fake data.</div>
      </div>

      <div class="section-h">Make it your own<span></span></div>
      <div class="panel steps">
        <div class="step"><div class="num"></div><div class="sc"><b>Get a copy.</b> Fork this repository — or open <b>Theme Settings</b> in Konstruct and let the <b>Forge</b> generate a whole new theme from a description.</div></div>
        <div class="step"><div class="num"></div><div class="sc"><b>Replace this UI.</b> Everything you see is in <code>static/index.html</code>. Build your metaphor there. Keep <code>theme.js</code> exactly as-is — it's the client for the contract above.</div></div>
        <div class="step"><div class="num"></div><div class="sc"><b>Push.</b> Konstruct watches your repo, rebuilds the image and redeploys automatically. No chart, no pipeline to wire up.</div></div>
        <div class="step"><div class="num"></div><div class="sc"><b>Register &amp; launch.</b> Point Konstruct at your repo, launch it, and your theme renders live org data. Read <code>THEME.md</code> in this repo, or the docs, to go deeper.</div></div>
      </div>

      <div class="section-h">Documentation<span></span></div>
      ${docLinks()}

      <footer><span>Theme Starter · the reference theme</span><span class="chip">informational</span><span>powered by</span><span class="chip">Konstruct</span></footer>`;
  }

  // ── launched mode: a read-only live operations dashboard ─────────────────
  // Everything below only READS: discover, quota, zones, apps, metrics,
  // buildLogs, and the logs/appEvents streams. No mutations, by design.
  const S = { caps: [], zones: [], apps: [], sizes: [], rates: {}, regions: [], quota: null, character: null,
    selected: null, logSub: null, logLines: [], logState: "connecting", evtSub: null, sparks: {}, deployments: {}, booted: false };

  const fmtCores = (v) => v >= 10 ? String(Math.round(v)) : v >= 1 ? v.toFixed(2) : v.toFixed(3);
  const fmtMB = (v) => `${Math.round(v / 1048576)} MB`;
  const fmtRate = (v) => v == null ? "—" : v >= 1048576 ? `${(v/1048576).toFixed(1)} MB/s` : v >= 1024 ? `${(v/1024).toFixed(1)} kB/s` : `${Math.round(v)} B/s`;
  const fmtGi = (v) => String(v ?? "").replace(/Gi$/, " GB");
  const pv = (pt) => parseFloat(Array.isArray(pt) ? pt[1] : (pt && typeof pt === "object" ? pt.v : pt));
  const seriesVals = (m, name) => (((m && m.series) || []).find((x) => x.name === name)?.points || []).map(pv).filter((v) => !Number.isNaN(v));
  const lastOf = (vals) => vals.length ? vals[vals.length - 1] : null;
  const relTime = (iso) => {
    const t = Date.parse(iso || ""); if (!t) return "";
    const m = Math.round((Date.now() - t) / 60000);
    return m < 1 ? "just now" : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
  };
  const durBetween = (a, b) => {
    const x = Date.parse(a || ""), y = Date.parse(b || ""); if (!x || !y) return "";
    const sec = Math.round((y - x) / 1000);
    return sec < 60 ? `${sec}s` : `${Math.floor(sec / 60)}m ${sec % 60}s`;
  };
  // resolve a plan size key ("s") to its real resources from discover()
  const sizeLabel = (key) => {
    const z = S.sizes.find((x) => x.key === key);
    return z ? `${esc(key)} · ${esc(z.cpu)} cpu · ${esc(fmtGi(z.memory))}` : esc(key || "—");
  };
  const reasonHuman = (d, branch) => {
    const r = String(d.reason || "").toUpperCase();
    if (r.includes("COMMIT")) return `push to ${branch || "main"}`;
    if (r.includes("TRIGGER")) return "manual relaunch";
    if (r.includes("CONFIG")) return "config change";
    if (r.includes("STACK") || r.includes("BUILDPACK")) return "platform stack refresh";
    return r ? r.toLowerCase() : "build";
  };

  // Zero-grounded polyline for a 600x88 viewBox, optional limit ceiling.
  function chartPath(vals, limit, top){
    const v = (vals || []).filter((x) => typeof x === "number" && !Number.isNaN(x));
    if (v.length < 2) return null;
    const t = (top || Math.max(...v, limit || 0)) || 1;
    const step = 600 / (v.length - 1);
    const y = (x) => (85 - (Math.min(x, t) / t) * 78).toFixed(1);
    const pts = v.map((x, i) => `${(i * step).toFixed(1)},${y(x)}`).join(" ");
    return { pts, area: `0,88 ${pts} 600,88`, limitY: limit ? y(limit) : null, last: v[v.length - 1], peak: Math.max(...v) };
  }
  const sparkPath = (vals, w, h) => {
    const v = (vals || []).filter((x) => typeof x === "number" && !Number.isNaN(x));
    if (v.length < 2) return "";
    const min = Math.min(...v), span = (Math.max(...v) - min) || 1, step = w / (v.length - 1);
    return v.map((x, i) => `${(i * step).toFixed(1)},${(h - 2 - ((x - min) / span) * (h - 4)).toFixed(1)}`).join(" ");
  };

  function quotaRows(q){
    if (!q) return "";
    const dims = [["cpu", "CPU", (v) => String(cores(v))], ["memory", "Memory", fmtGi], ["storage", "Storage", fmtGi]];
    return dims.map(([k, label, f]) => {
      const d = q[k] || {};
      const used = k === "cpu" ? cores(d.used) : parseFloat(String(d.used || "0").replace(/Gi$/, "")) || 0;
      const lim = k === "cpu" ? cores(d.limit) : parseFloat(String(d.limit || "0").replace(/Gi$/, "")) || 0;
      const pct = lim ? Math.min(100, (used / lim) * 100) : 0;
      const fg = pct > 85 ? "var(--red)" : pct > 60 ? "var(--amber)" : "var(--green)";
      return `<div class="quota-row"><span class="ql">${label}</span>
        <span class="bar"><i style="width:${pct}%;background:${fg}"></i></span>
        <span class="qv">${esc(f(d.used || "0"))} / ${d.limit ? esc(f(d.limit)) : "∞"}</span></div>`;
    }).join("");
  }

  function appCard(a){
    const name = a.name || a.app_name;
    const ph = a.status?.phase || "—";
    const url = typeof a.status?.url === "string" && a.status.url.startsWith("https://") ? a.status.url : "";
    const sp = S.sparks[name] || {};
    const cpuLast = lastOf(sp.cpu || []), memLast = lastOf(sp.mem || []);
    // themes serve their own face at /theme-icon.(svg|png); other apps get
    // a monogram so every card has the same anatomy
    const initial = esc(String(a.app_name || name).charAt(0).toUpperCase());
    const avatar = url && (a.status && "url_ready" in a.status ? a.status.url_ready : true)
      ? `<span class="ava"><span class="avaM">${initial}</span><img src="${esc(url)}/theme-icon.svg" alt="" loading="lazy" onerror="if(!this.dataset.p){this.dataset.p=1;this.src='${esc(url)}/theme-icon.png'}else{this.style.display='none'}"></span>`
      : `<span class="ava"><span class="avaM">${initial}</span></span>`;
    return `<div class="appcard${S.selected === name ? " sel" : ""}" data-app="${esc(name)}">
      <div class="top">${avatar}<span class="st ${esc(ph)}"><span class="dot"></span>${esc(ph)}</span><span class="an">${esc(a.app_name || name)}</span>
        ${a.environment ? `<span class="chip">${esc(a.environment)}</span>` : ""}
        ${a.volume && a.volume.size ? `<span class="bdg vol" title="persistent volume at ${esc(a.volume.mount_path || "/data")}">▣ ${esc(fmtGi(a.volume.size))}</span>` : ""}
        ${a.custom_domain ? `<span class="bdg ${a.status?.domain_verified ? "dom-ok" : "dom-wait"}">✦ ${esc(a.custom_domain)}${a.status?.domain_verified ? "" : " · verifying"}</span>` : ""}</div>
      ${url && (a.status && "url_ready" in a.status ? a.status.url_ready : true) ? `<a class="url" href="${esc(url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(url.replace("https://",""))}</a>` : url ? `<span class="mono" style="color:var(--amber);font-size:11px" title="the platform is verifying this URL fetches end-to-end before offering the link">⧗ ${esc(url.replace("https://",""))} · propagating</span>` : '<span class="mono" style="color:var(--mut2);font-size:11px">no endpoint yet</span>'}
      <div class="sparkrow">
        <span class="sl">CPU</span><svg width="96" height="22" viewBox="0 0 96 22" preserveAspectRatio="none"><polyline points="${sparkPath(sp.cpu, 96, 22)}" fill="none" stroke="var(--green)" stroke-width="1.3"/></svg>
        <span class="sl">MEM</span><svg width="96" height="22" viewBox="0 0 96 22" preserveAspectRatio="none"><polyline points="${sparkPath(sp.mem, 96, 22)}" fill="none" stroke="var(--blue)" stroke-width="1.3"/></svg>
        <span class="sl" style="color:var(--mut)">${cpuLast != null ? `${fmtCores(cpuLast)} cores` : ""}${memLast != null ? ` · ${fmtMB(memLast)}` : ""}</span>
      </div>
      <div class="meta"><span>${sizeLabel(a.size)}</span><span>× ${esc(a.replicas ?? 1)}</span><span>${esc(a.branch || "main")}</span>${a.port ? `<span>:${esc(a.port)}</span>` : ""}${a.sub_path ? `<span>/${esc(a.sub_path)}</span>` : ""}${Array.isArray(a.env) && a.env.length ? `<span>${a.env.length} env var${a.env.length > 1 ? "s" : ""}</span>` : ""}${a.public_url_enabled === false ? `<span style="color:var(--amber)">internal only</span>` : ""}${a.region ? `<span>${esc(a.region)}</span>` : ""}</div>
      ${ph === "Failed" && a.status?.message ? `<div class="failmsg">${esc(String(a.status.message).slice(0, 200))}</div>` : ""}
    </div>`;
  }

  function chartBlock(id, label, color, valueText, footText){
    return `<div class="chart"><div class="chh"><span class="cl">${label}</span><span class="cv" style="color:${color}">${esc(valueText)}</span></div>
      <svg id="${id}" viewBox="0 0 600 88" preserveAspectRatio="none"></svg>
      <div class="chf"><span>1h ago</span><span>${esc(footText)}</span><span>now</span></div></div>`;
  }
  function drawChart(id, c, color, fill, extra){
    const el = document.getElementById(id);
    if (!el) return;
    if (!c) { el.innerHTML = `<text x="300" y="48" text-anchor="middle" fill="var(--mut2)" font-size="11" font-family="var(--mono)">no samples yet</text>`; return; }
    let inner = `<polygon points="${c.area}" fill="${fill}"></polygon><polyline points="${c.pts}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"></polyline>`;
    if (c.limitY) inner += `<line x1="0" y1="${c.limitY}" x2="600" y2="${c.limitY}" stroke="var(--red)" stroke-width="1" stroke-dasharray="6,5" vector-effect="non-scaling-stroke"></line>`;
    el.innerHTML = inner + (extra || "");
  }

  function closeLogs(){
    if (S.logSub) { try { S.logSub(); } catch (e) {} }
    S.logSub = null;
  }
  function openLogs(name){
    closeLogs();
    S.logLines = []; S.logState = "connecting";
    if (!S.caps.includes("runtime-logs") || typeof theme.logs !== "function") { S.logState = "unavailable"; paintLogs(); return; }
    S.logSub = theme.logs(org, name, (l) => {
      const pod = l && l.pod ? `[${String(l.pod).slice(-12)}] ` : "◆ ";
      const line = l && (l.line ?? l.message) != null ? String(l.line ?? l.message) : String(l);
      S.logLines.push(pod + line);
      if (S.logLines.length > 400) S.logLines.splice(0, S.logLines.length - 400);
      S.logState = "live"; paintLogs();
    }, () => { S.logSub = null; S.logState = "ended"; paintLogs(); });
  }
  function paintLogs(){
    const pre = document.getElementById("logpre"), st = document.getElementById("logstate");
    if (!pre) return;
    pre.textContent = S.logLines.join("\n") || "… waiting for log lines";
    if (st) {
      st.textContent = S.logState === "live" ? "● live" : S.logState === "ended" ? "◼ stream ended" : S.logState === "unavailable" ? "not available on this install" : "connecting…";
      st.className = "lv" + (S.logState === "live" ? "" : " off");
    }
    const rec = document.getElementById("logrec");
    if (rec) rec.style.display = S.logState === "ended" ? "" : "none";
  }

  async function openDetail(name){
    S.selected = name;
    paintApps();
    const a = S.apps.find((x) => (x.name || x.app_name) === name) || {};
    const box = document.getElementById("detailP");
    box.style.display = "";
    const dUrl = typeof a.status?.url === "string" && a.status.url.startsWith("https://") ? a.status.url : "";
    const dAva = dUrl && (a.status && "url_ready" in a.status ? a.status.url_ready : true)
      ? `<span class="ava"><span class="avaM">${esc(String(a.app_name || name).charAt(0).toUpperCase())}</span><img src="${esc(dUrl)}/theme-icon.svg" alt="" onerror="if(!this.dataset.p){this.dataset.p=1;this.src='${esc(dUrl)}/theme-icon.png'}else{this.style.display='none'}"></span>`
      : "";
    box.innerHTML = `<h2 style="margin:0 0 4px;display:flex;align-items:center;gap:10px;font-size:13px">${dAva}${esc(a.app_name || name)}
        <span class="chip">${esc(a.environment || "")}</span><button class="closebtn" id="detclose">close ×</button></h2>
      <div class="sub">read-only telemetry · repo ${esc(a.repo_name || "—")} @ ${esc(a.branch || "main")}</div>
      <div class="statrow">
        <span>size <b>${sizeLabel(a.size)}</b></span><span>replicas <b>${esc(a.replicas ?? 1)}</b></span>
        ${a.port ? `<span>port <b>${esc(a.port)}</b></span>` : ""}
        ${a.sub_path ? `<span>sub path <b>/${esc(a.sub_path)}</b></span>` : ""}
        ${a.region ? `<span>region <b>${esc(a.region)}</b></span>` : ""}
        <span>reachability <b>${a.public_url_enabled === false ? "internal only" : "public URL"}</b></span>
        ${Array.isArray(a.env) && a.env.length ? `<span>env vars <b>${a.env.length}</b></span>` : ""}
        ${a.status?.image ? `<span>image <b>${esc(String(a.status.image).split("@").pop().slice(0, 15))}</b></span>` : ""}
        <span id="podstat"></span>
      </div>
      <div class="charts3" id="charts">${chartBlock("ch-cpu", "CPU · cores", "var(--green)", "…", "")}${chartBlock("ch-mem", "Memory", "var(--blue)", "…", "")}${chartBlock("ch-net", "Network · rx/tx", "var(--amber)", "…", "")}${chartBlock("ch-pods", "Pods · restarts", "var(--ink2)", "…", "")}</div>
      <div class="loghead">runtime logs · live from the running pods <span class="lv" id="logstate">connecting…</span><button class="reconnect" id="logrec" style="display:none">↻ reconnect</button></div>
      <div class="logpane"><pre id="logpre">…</pre></div>
      <div class="grp" style="padding-top:18px">Delivery record</div>
      <div class="loghead" style="margin-top:8px">deployment history · newest first</div>
      <div class="tl" id="deployTl"><div class="item mono" style="color:var(--mut2);border-top:none">loading…</div></div>
      <div class="loghead" id="buildhead">latest build output</div>
      <pre class="buildpre" id="buildpre">loading…</pre>`;
    document.getElementById("detclose").onclick = () => { S.selected = null; closeLogs(); box.style.display = "none"; paintApps(); };
    document.getElementById("logrec").onclick = () => openLogs(name);
    openLogs(name);
    theme.buildLogs(org, name).then((bl) => {
      const el = document.getElementById("buildpre");
      if (el) el.textContent = ((bl && bl.logs) || "").split("\n").slice(-40).join("\n").trim() || "(no build output recorded)";
    }).catch(() => {});
    paintDeployments(name, a.branch, a.status?.image || "");
    refreshDetailCharts(name);
  }

  // real build history through the contract — render it or nothing, never invent
  function paintDeployments(name, branch, runningImage){
    const el = document.getElementById("deployTl");
    if (!el) return;
    if (typeof theme.deployments !== "function") { el.innerHTML = '<div class="item mono" style="color:var(--mut2);border-top:none">not available on this install</div>'; return; }
    theme.deployments(org, name).then((list) => {
      const box = document.getElementById("deployTl");
      if (!box || S.selected !== name) return;
      const items = Array.isArray(list) ? list : [];
      // the build whose image is serving right now — so history reads as a
      // record with one clear "you are here", not a list of dead choices
      const runningRef = runningImage ? (items.find((d) => d.image === runningImage) || {}).ref : null;
      const rows = items.map((d) => {
        const ph = d.phase || "Building";
        const running = runningRef ? d.ref === runningRef : false;
        return `<div class="tlrow"${running ? ' style="background:rgba(0,255,111,.04)"' : ""}><span class="st ${esc(ph === "Succeeded" ? "Live" : ph)}" style="flex:0 0 16px"><span class="dot"></span></span>
          <span class="tn">BUILD #${esc(d.build ?? "?")}</span>
          ${running ? `<span class="bdg dom-ok">▶ running now</span>` : ""}
          <span class="trr">${esc(reasonHuman(d, branch))}</span>
          ${d.revision ? `<span class="trv">${esc(String(d.revision).slice(0, 8))}</span>` : ""}
          ${ph === "Failed" ? `<span class="trv" style="color:var(--red)">failed</span>` : ph !== "Succeeded" ? `<span class="trv" style="color:var(--blue)">building…</span>` : ""}
          <span class="trd">${esc(durBetween(d.started_at, d.finished_at))}${d.started_at ? ` · ${esc(relTime(d.started_at))}` : ""}</span></div>`;
      }).join("");
      box.innerHTML = rows || '<div class="item mono" style="color:var(--mut2);border-top:none">no builds recorded yet</div>';
      const bh = document.getElementById("buildhead");
      if (bh && items.length) bh.textContent = `build output · build #${items[0].build ?? "?"} (latest)`;
    }).catch(() => {
      const box = document.getElementById("deployTl");
      if (box) box.innerHTML = '<div class="item mono" style="color:var(--mut2);border-top:none">history unavailable</div>';
    });
  }

  async function refreshDetailCharts(name){
    if (S.selected !== name) return;
    try {
      const m = await theme.metrics(org, name, { range: "1h", step: "60s" });
      if (S.selected !== name) return;
      const cpu = seriesVals(m, "cpu"), cpuLim = lastOf(seriesVals(m, "cpu_limit"));
      const mem = seriesVals(m, "memory"), memLim = lastOf(seriesVals(m, "memory_limit"));
      const rx = seriesVals(m, "network_rx"), tx = seriesVals(m, "network_tx");
      const cC = chartPath(cpu, cpuLim), cM = chartPath(mem, memLim);
      const netTop = Math.max(...rx, ...tx, 1);
      const cRx = chartPath(rx, null, netTop), cTx = chartPath(tx, null, netTop);
      drawChart("ch-cpu", cC, "var(--green)", "rgba(0,255,111,.08)");
      drawChart("ch-mem", cM, "var(--blue)", "rgba(0,188,255,.08)");
      drawChart("ch-net", cRx, "var(--amber)", "rgba(253,199,63,.08)", cTx ? `<polyline points="${cTx.pts}" fill="none" stroke="var(--blue)" stroke-width="1.6" vector-effect="non-scaling-stroke"></polyline>` : "");
      const set = (sel, txt) => { const e = document.querySelector(sel); if (e) e.textContent = txt; };
      set("#charts .chart:nth-child(1) .cv", cC ? `${fmtCores(cC.last)} cores` : "—");
      set("#charts .chart:nth-child(1) .chf span:nth-child(2)", cpuLim ? `limit ${fmtCores(cpuLim)}` : (cC ? `peak ${fmtCores(cC.peak)}` : ""));
      set("#charts .chart:nth-child(2) .cv", cM ? fmtMB(cM.last) : "—");
      set("#charts .chart:nth-child(2) .chf span:nth-child(2)", memLim ? `limit ${fmtMB(memLim)}` : (cM ? `peak ${fmtMB(cM.peak)}` : ""));
      set("#charts .chart:nth-child(3) .cv", `rx ${fmtRate(lastOf(rx))} · tx ${fmtRate(lastOf(tx))}`);
      set("#charts .chart:nth-child(3) .chf span:nth-child(2)", `peak rx ${fmtRate(cRx ? cRx.peak : null)} · tx ${fmtRate(cTx ? cTx.peak : null)}`);
      const pods = seriesVals(m, "pods"), restarts = seriesVals(m, "restarts");
      const podTop = Math.max(...pods, ...restarts, 1);
      const cP = chartPath(pods, null, podTop), cR = chartPath(restarts, null, podTop);
      drawChart("ch-pods", cP, "var(--ink2)", "rgba(199,206,211,.06)", cR ? `<polyline points="${cR.pts}" fill="none" stroke="var(--red)" stroke-width="1.6" vector-effect="non-scaling-stroke"></polyline>` : "");
      const rNow = lastOf(restarts), rStart = restarts.length ? restarts[0] : null;
      const newRestarts = rNow != null && rStart != null ? Math.max(0, rNow - rStart) : null;
      set("#charts .chart:nth-child(4) .cv", cP ? `${Math.round(cP.last)} pod${Math.round(cP.last) === 1 ? "" : "s"}${rNow != null ? ` · ${Math.round(rNow)} restarts` : ""}` : "—");
      set("#charts .chart:nth-child(4) .chf span:nth-child(2)", newRestarts != null ? (newRestarts > 0 ? `⚠ ${newRestarts} restart${newRestarts === 1 ? "" : "s"} this hour` : "no restarts this hour") : "");
      const pe = document.getElementById("podstat");
      if (pe && newRestarts != null && newRestarts > 0) pe.innerHTML = `<span style="color:var(--red)">⚠ ${newRestarts} restart${newRestarts === 1 ? "" : "s"} in the last hour</span>`;
    } catch (e) {}
  }

  // apps are organized the way the platform organizes them: by environment.
  // Zone metadata (display name, free/enabled, phase, draw) heads each group;
  // platform-delivered themes have no environment and get an honest label.
  function zoneHead(z, groupApps){
    const draw = cores(z.status?.allocated_cpu);
    return `<div class="zonehead"><span class="zn">${esc(z.display_name || z.name)}</span>
      ${z.display_name && z.display_name !== z.name ? `<span class="zsub">${esc(z.name)}</span>` : ""}
      ${z.enabled === false ? `<span class="zchip off">disabled</span>` : ""}
      ${z.status?.phase && z.status.phase !== "Live" && z.status.phase !== "Ready" ? `<span class="zchip off">${esc(z.status.phase)}</span>` : ""}
      <span class="spacer"></span>
      <span class="zsub">${draw ? `${draw} cpu drawn · ` : ""}${groupApps.length} app${groupApps.length === 1 ? "" : "s"}</span></div>`;
  }
  function paintApps(){
    const el = document.getElementById("appsP");
    if (!el) return;
    if (!S.apps.length) {
      el.innerHTML = '<div class="item mono" style="color:var(--mut)">No apps yet — ship one from Konduit or any interactive theme.</div>';
      return;
    }
    const zoneOf = (a) => a.zone_ref || a.environment || "";
    let html = "";
    for (const z of S.zones) {
      const group = S.apps.filter((a) => zoneOf(a) === z.name);
      html += zoneHead(z, group);
      html += group.length
        ? `<div class="appsgrid">${group.map(appCard).join("")}</div>`
        : '<div class="item mono" style="color:var(--mut2);border-top:none;font-size:12px">nothing shipped here yet</div>';
    }
    const zoneNames = new Set(S.zones.map((z) => z.name));
    const unzoned = S.apps.filter((a) => !zoneNames.has(zoneOf(a)));
    if (unzoned.length) {
      html += `<div class="zonehead"><span class="zn">Platform deliveries</span><span class="zsub">no environment — themes and platform-managed apps</span><span class="spacer"></span><span class="zsub">${unzoned.length} app${unzoned.length === 1 ? "" : "s"}</span></div>`;
      html += `<div class="appsgrid">${unzoned.map(appCard).join("")}</div>`;
    }
    el.innerHTML = html;
    el.querySelectorAll(".appcard").forEach((c) => { c.onclick = () => openDetail(c.dataset.app); });
  }

  async function refreshSparks(){
    for (const a of S.apps) {
      const name = a.name || a.app_name;
      if ((a.status?.phase) !== "Live" && (a.status?.phase) !== "Failed") continue;
      try {
        const m = await theme.metrics(org, name, { range: "1h", step: "2m" });
        S.sparks[name] = { cpu: seriesVals(m, "cpu"), mem: seriesVals(m, "memory") };
      } catch (e) {}
    }
    paintApps();
    paintFleet();
  }

  // fleet strip: the summary an operator wants before any detail
  function paintFleet(){
    const el = document.getElementById("fleetP");
    if (!el) return;
    const ph = (p) => S.apps.filter((a) => a.status?.phase === p).length;
    const live = ph("Live"), failed = ph("Failed");
    const building = S.apps.length - live - failed;
    const replicas = S.apps.reduce((t, a) => t + (a.replicas || 1), 0);
    const cpuNow = Object.values(S.sparks).reduce((t, sp) => t + (lastOf(sp.cpu || []) || 0), 0);
    const memNow = Object.values(S.sparks).reduce((t, sp) => t + (lastOf(sp.mem || []) || 0), 0);
    el.innerHTML = `
      <div class="stat"><div class="kv"><b>${live}</b> / ${S.apps.length}</div><div class="kl">apps live</div>
        <div class="ks">${failed ? `<span style="color:var(--red)">${failed} failed</span>` : building ? `${building} building` : "all healthy"}</div></div>
      <div class="stat"><div class="kv">${replicas}</div><div class="kl">replicas running</div><div class="ks">${S.zones.length} environment${S.zones.length === 1 ? "" : "s"}</div></div>
      <div class="stat"><div class="kv">${cpuNow ? fmtCores(cpuNow) : "—"}</div><div class="kl">cores in use now</div><div class="ks">${memNow ? fmtMB(memNow) + " memory" : "measured across live apps"}</div></div>
      <div class="stat"><div class="kv">${S.regions.length ? esc(S.regions.map((r) => r.name).join(", ")) : "—"}</div><div class="kl">region${S.regions.length === 1 ? "" : "s"}</div><div class="ks">workload cluster${S.regions.length === 1 ? "" : "s"} apps can target</div></div>`;
  }
  // plan reference: entitled sizes and metered rates, straight from discover()
  function paintRef(d){
    const el = document.getElementById("refP");
    if (!el) return;
    let html = "";
    if (S.sizes.length) {
      html += `<div class="grp">Entitled app sizes</div><div class="refline">` +
        S.sizes.map((z) => `<span class="rk"><b>${esc(z.key)}</b> ${esc(z.cpu)} cpu · ${esc(fmtGi(z.memory))}</span>`).join("") + `</div>`;
    }
    const rates = Object.entries(S.rates || {});
    if (rates.length) {
      html += `<div class="grp">Metered rates</div><div class="refline">` +
        rates.map(([k, v]) => `<span class="rk"><b>${esc(k.replace(/_/g, " "))}</b> ${esc(v)}</span>`).join("") + `</div>`;
    }
    el.innerHTML = html;
  }
  async function refreshData(){
    try {
      const [zonesR, appsR, quotaR] = await Promise.all([
        theme.zones(org).catch(() => []),
        theme.apps(org).catch(() => []),
        S.caps.includes("quota") ? theme.quota(org).catch(() => null) : Promise.resolve(null),
      ]);
      S.zones = Array.isArray(zonesR) ? zonesR : (zonesR.zones || []);
      S.apps = Array.isArray(appsR) ? appsR : (appsR.apps || []);
      S.quota = quotaR;
      const qEl = document.getElementById("quotaP");
      if (qEl && quotaR) qEl.innerHTML = `<div class="grp" style="padding-top:0">Org allowance${quotaR.plan ? ` · ${esc(quotaR.plan)} plan` : ""}${quotaR.capped ? ` · <span style="color:var(--amber)">hard-capped</span>` : ""}</div>` + quotaRows(quotaR);
      paintFleet();
      paintApps();
      // open the first app on arrival — the tiles hide the best part
      // (telemetry, history, live logs) and one worked example teaches it
      if (!S.booted && S.apps.length) {
        S.booted = true;
        const zoneOf = (a) => a.zone_ref || a.environment || "";
        let first = null;
        for (const z of S.zones) {
          const g = S.apps.filter((a) => zoneOf(a) === z.name);
          if (g.length) { first = g[0]; break; }
        }
        if (!first) first = S.apps[0];
        openDetail(first.name || first.app_name);
      }
    } catch (e) {}
  }

  async function renderLive(){
    root.innerHTML = `<div class="live-banner"><span class="dot" style="width:8px;height:8px;border-radius:50%"></span>
      Live — a read-only operations view of <b style="color:var(--ink)">&nbsp;${esc(org)}&nbsp;</b>, rendered entirely through the theme. <a href="${DOCS}" target="_blank" rel="noopener">&nbsp;What is this? →</a></div>
      <div class="fleet" id="fleetP"></div>
      <div class="panel"><h2 id="orgH">Organization</h2><div class="sub" id="capsLine" style="display:none"></div><div id="quotaP"></div><div id="refP"></div></div>
      <div class="panel"><h2>Environments &amp; applications <span class="sub" style="margin:0;font-weight:400">· click an app for live telemetry &amp; history</span></h2><div id="appsP">loading…</div></div>
      <div class="panel" id="detailP" style="display:none"></div>
      <div class="panel" style="border-left:2px solid var(--green)"><h2>This is the starter</h2>
        <div class="sub">A fully hydrated, read-only reference: quota, environments, apps, real deployment history, per-app metrics with limit ceilings, pods &amp; restarts, live runtime logs, and build output — every read the theme offers, nothing invented. Fork it and make it yours.</div>
        <div class="item" style="border-top:none;gap:16px"><a href="${DOCS}/creating-a-theme" target="_blank" rel="noopener">Creating a theme →</a><a href="${DOCS}/theme-spec" target="_blank" rel="noopener">Theme spec →</a><a href="${DOCS}/theme" target="_blank" rel="noopener">The theme →</a></div></div>
      <footer><span>Theme Starter · the reference theme</span><span class="chip">informational</span></footer>`;
    try {
      const d = await theme.discover(org);
      S.caps = d.capabilities || [];
      const h = document.getElementById("orgH");
      if (h) h.textContent = d.org?.display_name || org;
      // capabilities are real discover() data, but a bare chip row reads as
      // broken navigation — label it as the informational line it is
      const CAP_HINTS = {
        "apps": "list, ship, update, and remove apps",
        "zones": "environments to ship into",
        "themes": "install and register theme themes",
        "character": "cross-theme progression ledger",
        "runtime-logs": "live pod log streaming (the panel below)",
        "quota": "the org allowance meter above",
        "app-events": "push-driven refresh instead of polling",
        "volumes": "persistent disks on apps",
        "custom-domains": "serve apps from your own domain",
      };
      const cl = document.getElementById("capsLine");
      if (cl && S.caps.length) {
        cl.style.display = "";
        cl.innerHTML = `this install advertises via <code style="font-family:var(--mono)">discover()</code>: ` +
          S.caps.map((c) => `<span class="chip" title="${esc(CAP_HINTS[c] || c)}">${esc(c)}</span>`).join(" ") +
          ` <span style="opacity:.7">— hover a capability; themes gate features on these flags</span>`;
      }
      S.sizes = d.app_sizes || [];
      S.rates = d.rates || {};
      paintRef(d);
      if (typeof theme.regions === "function") {
        theme.regions(org).then((r) => { S.regions = Array.isArray(r) ? r : []; paintFleet(); }).catch(() => {});
      }
      // the signed-in user's cross-theme progression ledger — read-only, and a
      // live demonstration of the character op every theme shares
      if (S.caps.includes("character") && typeof theme.character === "function") {
        theme.character(org).then((c) => {
          if (!c || (!c.level && !(c.inventory || []).length && !(c.quests || []).length)) return;
          const f = document.querySelector("footer");
          if (f) f.insertAdjacentHTML("afterbegin",
            `<span class="mono" title="theme.character() — the progression ledger shared by every theme in this org">your character: ${c.display_name ? esc(c.display_name) + " · " : ""}${c.level ? `LV ${esc(c.level)} · ` : ""}${c.xp ? `${esc(c.xp)} XP · ` : ""}${(c.inventory || []).length} item${(c.inventory || []).length === 1 ? "" : "s"} · ${(c.quests || []).length} quest${(c.quests || []).length === 1 ? "" : "s"} done</span>`);
        }).catch(() => {});
      }
      await refreshData();
      refreshSparks();
      // Push-driven refresh when the platform supports it; poll fallback.
      if (S.caps.includes("app-events") && typeof theme.appEvents === "function") {
        S.evtSub = theme.appEvents(org, () => refreshData(), () => { S.evtSub = null; });
      }
    } catch (e) {
      root.innerHTML += `<div class="panel"><h2>Couldn't load your org</h2><div class="err">${esc(e && e.message || e)}</div></div>`;
    }
  }

  function render(){
    if (!theme.isLaunched()) { renderWelcome(); return; }
    renderLive();
  }
  render();
  // Steady refresh: data every 15s (skipped when push events are flowing),
  // sparklines + open detail charts every 30s. The welcome guide is static.
  setInterval(() => { if (theme.isLaunched() && !S.evtSub) refreshData(); }, 15000);
  setInterval(() => { if (theme.isLaunched()) { refreshSparks(); if (S.selected) refreshDetailCharts(S.selected); } }, 30000);
</script>
</body>
</html>
